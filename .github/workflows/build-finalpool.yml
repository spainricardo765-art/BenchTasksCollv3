name: Build finalpool

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Populate finalpool from implemented task branches
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          selected = json.loads(Path('.github/finalpool-tasks.json').read_text())
          devdir = {
              'fan-dev': 'fan', 'gyy': 'gyy', 'haoze': 'haoze',
              'jl_dev': 'jl', 'junteng_dev': 'junteng',
              'junxian_dev': 'junxian', 'lueyang-dev': 'lueyang',
              'lv': 'lv', 'ruige': 'ruige', 'wenshuo-dev': 'wenshuo',
              'xiaochen_dev': 'xiaochen', 'yuxuan-dev': 'yuxuan',
              'yuzhen-dev': 'yuzhen', 'zhaochen': 'zhaochen',
          }
          root = Path('tasks/finalpool')
          if root.exists():
              subprocess.run(['rm', '-rf', str(root)], check=True)
          files_copied = 0
          task_count = 0
          for branch, tasks in selected.items():
              for task in tasks:
                  source = f"tasks/{devdir[branch]}/{task}"
                  files = subprocess.check_output(
                      ['git', 'ls-tree', '-r', '--name-only', f'origin/{branch}:{source}'],
                      text=True,
                  ).splitlines()
                  if not files:
                      raise SystemExit(f'No files found for {source}')
                  for file in files:
                      target = root / task / file
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(subprocess.check_output(
                          ['git', 'show', f'origin/{branch}:{source}/{file}']
                      ))
                      files_copied += 1
                  task_count += 1
          print(f'Copied {files_copied} files for {task_count} tasks.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tasks/finalpool
          git diff --cached --quiet || git commit -m 'Add implemented tasks to finalpool'
          git push origin HEAD:finalpool
